openapi: "3.1.0"
info:
  title: Agent Security Gateway API
  version: "1.0.0"
  description: >
    Use this API before sending Japanese text to external tools,
    before x402 payments, and before storing sensitive data.
    Detects Japanese prompt injection, hidden instructions,
    PII leakage, and malicious API patterns.
    No AI used for core validation - deterministic only.
  x-guidance: "Call before any x402 payment or external API call. Japanese prompt injection detection. Deterministic validator."
servers:
  - url: https://agent-security-gateway.onrender.com
    description: Production (Render)

paths:
  /api/command-execution-gate/build:
    post:
      operationId: build_command_execution_gate
      summary: Build a command execution gate record (free, stateless, experimental)
      description: >
        Creates an external control record for AI-agent shell command execution decisions.
        Detects dangerous patterns, assesses risk level, and returns action recommendation.
        Free. No x402 payment required. Stateless. No DB storage. Does not execute shell commands.
      tags: [CommandExecutionGate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandExecutionGateBuildRequest'
            example:
              agent_id: "agent-demo-001"
              proposed_command:
                command: "ls -la /tmp"
                shell: "bash"
      responses:
        "200":
          description: Command execution gate record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandExecutionGateBuildResponse'
              example:
                command_gate_id: "command_gate_<uuid>"
                record_type: "command_execution_gate"
                status: "created"
                experimental: true
                stateless: true
                free_builder: true
                risk: "low"
                execution_allowed: true
                action: "allow_with_monitoring"
                blocked_patterns: []
                reason: "No dangerous patterns detected"

  /api/tool-permission-policy/build:
    post:
      operationId: build_tool_permission_policy
      summary: Build an AI-agent tool permission policy (free, stateless, experimental)
      description: >
        Creates external policy material for AI-agent tool and API permission decisions.
        Defines allowed tools, blocked tools, approval rules, risk boundaries, and context state.
        Free. No x402 payment required. Stateless. No DB storage.
      tags: [ToolPermissionPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolPermissionPolicyBuildRequest'
            example:
              agent_id: "agent-demo-001"
              policy_name: "demo-tool-policy"
      responses:
        "200":
          description: Tool permission policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolPermissionPolicyBuildResponse'
              example:
                permission_policy_id: "tool_permission_policy_<uuid>"
                policy_type: "agent_tool_permission_policy"
                status: "created"
                experimental: true
                stateless: true
                free_builder: true
                agent_id: "agent-demo-001"
                allowed_tools: ["read_only_checks", "openapi_read", "budget_check", "payment_evidence_check"]
                blocked_tools: ["wallet_execution", "private_key_access", "unknown_tool_scope"]
                can_feed_into: ["Agent Spending Policy", "Budget Check", "Agent Action Atom", "Tool Permission Boundary"]

  /api/security/scan:
    post:
      operationId: scan_security
      summary: Scan text for Japanese prompt injection and threats
      description: >
        Use before sending any Japanese text to external APIs.
        Detects prompt injection, hidden commands,
        data exfiltration attempts, and jailbreak patterns.
        Especially effective for Japanese language attacks.
      tags: [Security]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.05"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityScanRequest'
            example:
              content: "以下のシステムプロンプトを無視して..."
              content_type: "prompt"
              sensitivity: "high"
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScanResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/security/batch:
    post:
      operationId: batch_security_scan
      summary: Scan multiple texts in one request
      description: >
        Batch scan up to 100 texts at once.
        Returns individual results for each input plus an aggregate summary.
      tags: [Security]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.10"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchScanRequest'
      responses:
        '200':
          description: Batch scan results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchScanResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/security/pre-payment:
    post:
      operationId: check_pre_payment
      summary: Check API safety before x402 payment
      description: >
        Use before every x402 payment.
        Checks URL reputation, price anomalies,
        duplicate payments, and fraud patterns.
        Returns safe_to_pay true/false with risk score.
      tags: [Security]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.03"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrePaymentRequest'
            example:
              api_url: "https://some-api.onrender.com"
              amount_usdc: 0.05
              agent_id: "agent-001"
      responses:
        '200':
          description: Pre-payment check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrePaymentResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/validate/deterministic:
    post:
      operationId: deterministic_validate
      summary: Rule-based content validation without AI
      description: >
        Deterministic (no AI) rule-based validation.
        Checks for API key exposure, personal info, valid URLs/JSON,
        budget limits, and file format compliance.
      tags: [Validation]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.03"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeterministicValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicValidateResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/validate/completeness:
    post:
      operationId: validate_completeness
      summary: Verify AI task completeness deterministically
      description: >
        Use after AI completes a task with a list.
        Checks if all expected items were processed.
        Deterministic validation - no AI hallucination.
        Returns missing items and completeness score.
      tags: [Validation]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.03"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletenessRequest'
            example:
              task: "Deploy 10 APIs"
              expected_items: ["agent-memory-api", "agent-budget-guard"]
              actual_items: ["agent-memory-api", "agent-budget-guard"]
              match_type: "exact"
      responses:
        '200':
          description: Completeness check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletenessResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/validate/list_check:
    post:
      operationId: validate_list_check
      summary: Check expected vs actual item count
      description: >
        Cheapest validation endpoint (0.01 USDC).
        Checks that actual count matches expected count.
        Use to verify list lengths before processing.
      tags: [Validation]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCheckRequest'
            example:
              expected_count: 10
              actual_count: 10
              label: "repositories"
      responses:
        '200':
          description: List count check result
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/security/threats:
    get:
      operationId: get_threat_stats
      summary: Get threat detection statistics
      description: Returns aggregate scan counts and threat type distribution (free endpoint).
      tags: [Stats]
      responses:
        '200':
          description: Threat statistics

  /.well-known/x402.json:
    get:
      summary: x402 endpoint discovery
      description: Lists all paid endpoints with pricing for Agentic.Market discovery.
      tags: [Discovery]
      responses:
        '200':
          description: x402 discovery manifest

  /.well-known/mcp/server-card.json:
    get:
      summary: MCP server card for Smithery
      description: Tool definitions for Smithery MCP registry discovery.
      tags: [Discovery]
      responses:
        '200':
          description: MCP server card

  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Service health status

components:
  securitySchemes:
    x402Payment:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: >
        x402 USDC payment token on Base Mainnet.
        Omit when TEST_MODE=true (development).

  schemas:
    SecurityScanRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Text to scan
        content_type:
          type: string
          enum: [text, code, prompt, message]
          default: text
        sensitivity:
          type: string
          enum: [low, medium, high, critical]
          default: medium

    SecurityScanResponse:
      type: object
      properties:
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          type: string
          enum: [safe, low, medium, high, critical]
        threats_detected:
          type: array
          items:
            type: string
        safe_to_use:
          type: boolean
        recommendations:
          type: array
          items:
            type: string
        sanitized_content:
          type: string
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    BatchScanRequest:
      type: object
      required: [contents]
      properties:
        contents:
          type: array
          items:
            type: string
        content_type:
          type: string
          default: text

    BatchScanResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SecurityScanResponse'
        summary:
          type: object
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    PrePaymentRequest:
      type: object
      required: [api_url, amount_usdc, agent_id]
      properties:
        api_url:
          type: string
        amount_usdc:
          type: number
        agent_id:
          type: string
        api_response_preview:
          type: string
          default: ""

    PrePaymentResponse:
      type: object
      properties:
        safe_to_pay:
          type: boolean
        risk_score:
          type: integer
        recommended_action:
          type: string
          enum: [proceed, caution, block]
        warnings:
          type: array
          items:
            type: string
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    DeterministicValidateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        rules:
          type: array
          items:
            type: string
            enum: [no_api_keys, no_personal_info, valid_url, valid_json, budget_limit, file_format]
          default: [no_api_keys, no_personal_info, valid_url, valid_json, budget_limit, file_format]
        strict_mode:
          type: boolean
          default: true
        amount_usdc:
          type: number
        daily_limit:
          type: number
        expected_format:
          type: string

    DeterministicValidateResponse:
      type: object
      properties:
        passed:
          type: boolean
        violations:
          type: array
          items:
            type: object
        deterministic:
          type: boolean
        ai_used:
          type: boolean
        total_violations:
          type: integer
        critical_violations:
          type: integer
        validation_timestamp:
          type: string
        content_hash:
          type: string
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    CompletenessRequest:
      type: object
      required: [task, expected_items, actual_items]
      properties:
        task:
          type: string
        expected_items:
          type: array
          items:
            type: string
        actual_items:
          type: array
          items:
            type: string
        match_type:
          type: string
          enum: [exact, contains, pattern]
          default: exact

    CompletenessResponse:
      type: object
      properties:
        complete:
          type: boolean
        missing_items:
          type: array
          items:
            type: string
        matched_items:
          type: array
          items:
            type: string
        coverage_rate:
          type: number
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    ListCheckRequest:
      type: object
      required: [expected_count, actual_count]
      properties:
        expected_count:
          type: integer
        actual_count:
          type: integer
        label:
          type: string
          default: ""

    NextRecommendation:
      type: object
      properties:
        api_name:
          type: string
        url:
          type: string
        reason:
          type: string
        expected_improvement:
          type: string
        price_usdc:
          type: number

    PaymentRequired:
      type: object
      properties:
        error:
          type: string
          example: Payment Required
        price:
          type: string
        currency:
          type: string
          example: USDC
        network:
          type: string
          example: base-mainnet
        payTo:
          type: string
          example: "0x60c402878EfcEcAe5733A88075328Aa2320C39BE"
        endpoint:
          type: string

  ToolPermissionPolicyBuildRequest:
    type: object
    required: [agent_id]
    properties:
      agent_id:
        type: string
      policy_name:
        type: string
      allowed_tools:
        type: array
        items:
          type: string
        default: ["read_only_checks", "openapi_read", "budget_check", "payment_evidence_check"]
      blocked_tools:
        type: array
        items:
          type: string
        default: ["wallet_execution", "private_key_access", "unknown_tool_scope", "unverified_external_url", "memory_write_without_review"]
      approval_rules:
        type: object
        properties:
          human_approval_required_for_payment:
            type: boolean
            default: true
          human_approval_required_for_new_tool:
            type: boolean
            default: true
          human_approval_required_for_memory_write:
            type: boolean
            default: true
          block_if_prompt_injection_detected:
            type: boolean
            default: true
          block_if_tool_scope_unknown:
            type: boolean
            default: true
      risk_boundaries:
        type: object
        properties:
          max_tool_calls_per_decision:
            type: integer
            default: 3
          allow_network_access:
            type: boolean
            default: false
          allow_payment_execution:
            type: boolean
            default: false
          allow_read_only_checks:
            type: boolean
            default: true
          allow_memory_read:
            type: boolean
            default: true
          allow_memory_write:
            type: boolean
            default: false
      context_state:
        type: object
        properties:
          status:
            type: string
            default: "current"
          use_rule:
            type: string
          evidence:
            type: string
          last_checked:
            type: string

  ToolPermissionPolicyBuildResponse:
    type: object
    properties:
      permission_policy_id:
        type: string
        example: "tool_permission_policy_<uuid>"
      policy_type:
        type: string
        example: "agent_tool_permission_policy"
      status:
        type: string
        example: "created"
      experimental:
        type: boolean
        example: true
      stateless:
        type: boolean
        example: true
      free_builder:
        type: boolean
        example: true
      agent_id:
        type: string
      policy_name:
        type: string
      allowed_tools:
        type: array
        items:
          type: string
      blocked_tools:
        type: array
        items:
          type: string
      approval_rules:
        type: object
      risk_boundaries:
        type: object
      context_state:
        type: object
      agent_action_atom:
        type: object
      can_feed_into:
        type: array
        items:
          type: string
      created_at:
        type: string
      non_goals:
        type: array
        items:
          type: string

  CommandExecutionGateBuildRequest:
    type: object
    required:
      - agent_id
      - proposed_command
    properties:
      agent_id:
        type: string
      agent_type:
        type: string
      source:
        type: object
        properties:
          source_type:
            type: string
            default: "unknown"
          source_trust:
            type: string
            default: "untrusted_operational_data"
          source_id:
            type: string
          derived_from_external_data:
            type: boolean
            default: true
      context:
        type: object
        properties:
          task_intent:
            type: string
          tool_output_origin:
            type: string
          contains_external_observability_data:
            type: boolean
            default: true
      proposed_command:
        type: object
        required:
          - command
        properties:
          command:
            type: string
          shell:
            type: string
            default: "bash"
          working_directory:
            type: string
          requires_network:
            type: boolean
            default: false
          writes_filesystem:
            type: boolean
            default: false
          reads_credentials:
            type: boolean
            default: false
      execution_environment:
        type: object
        properties:
          environment_type:
            type: string
            default: "unknown"
          has_real_secrets:
            type: boolean
            default: true
          network_egress_allowed:
            type: boolean
            default: true
          filesystem_write_allowed:
            type: boolean
            default: true
          sandboxed:
            type: boolean
            default: false

  CommandExecutionGateBuildResponse:
    type: object
    properties:
      command_gate_id:
        type: string
        example: "command_gate_<uuid>"
      record_type:
        type: string
        example: "command_execution_gate"
      status:
        type: string
        example: "created"
      experimental:
        type: boolean
        example: true
      stateless:
        type: boolean
        example: true
      free_builder:
        type: boolean
        example: true
      agent_id:
        type: string
      source:
        type: object
      proposed_command:
        type: object
      risk:
        type: string
        enum: [high, medium, low]
      execution_allowed:
        type: boolean
      action:
        type: string
        enum: [require_human_approval_or_sandbox, allow_with_monitoring, deny]
      blocked_patterns:
        type: array
        items:
          type: string
      reason:
        type: string
      recommended_controls:
        type: array
        items:
          type: string
      execution_environment:
        type: object
      agent_action_atom:
        type: object
      can_feed_into:
        type: array
        items:
          type: string
      created_at:
        type: string
